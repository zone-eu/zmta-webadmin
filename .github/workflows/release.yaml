on:
    push:
        branches:
            - master

# Default to read-only permissions
permissions: read-all

name: release
jobs:
    release_please:
        timeout-minutes: 30
        permissions:
            contents: write
            pull-requests: write
        runs-on: ubuntu-latest
        steps:
            - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
